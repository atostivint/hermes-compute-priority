<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <text x="48" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#5f646b">One core, two processes, one priority</text>
  <text x="48" y="84" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#767b82">The worker inherits its parent's "nice" at fork &#8212; nice is the scheduling priority: a lower number gets more CPU.</text>
  <line x1="48" y1="104" x2="1152" y2="104" stroke="#767b82" stroke-opacity="0.45" stroke-width="1"/>

  <rect x="40" y="116" width="520" height="356" rx="8" fill="none" stroke="#767b82" stroke-opacity="0.45" stroke-width="1"/>
  <text x="64" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="1.2" fill="#5f646b">(1) WITHOUT THE PLUGIN</text>
  <text x="64" y="184" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#767b82">compute_host is a child of dashboard.</text>
  <text x="64" y="208" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#767b82">It inherits nice -5, so both get the same share.</text>

  <text x="196" y="236" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="0.9" fill="#767b82">ONE CORE (1 vCPU)</text>
  <text x="444" y="236" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#767b82">time &#8594;</text>
  <rect x="188" y="250" width="264" height="120" rx="6" fill="none" stroke="#767b82" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="6 5"/>

  <rect x="196" y="264" width="248" height="34" fill="#3b7dd8" fill-opacity="0.22" stroke="#3b7dd8" stroke-width="1.5"/>
  <text x="64" y="287" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#5f646b">dashboard</text>
  <text x="464" y="287" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#767b82">nice -5</text>

  <rect x="196" y="320" width="248" height="34" fill="#cf7a1f" fill-opacity="0.22" stroke="#cf7a1f" stroke-width="1.5"/>
  <text x="64" y="343" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#5f646b">compute_host</text>
  <text x="464" y="343" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#767b82">nice -5</text>

  <text x="64" y="424" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#5f646b">Neither side wins: the connection waits its turn.</text>

  <rect x="640" y="116" width="520" height="356" rx="8" fill="none" stroke="#767b82" stroke-opacity="0.45" stroke-width="1"/>
  <text x="664" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" letter-spacing="1.2" fill="#5f646b">(2) WITH HERMES-COMPUTE-PRIORITY</text>
  <text x="664" y="184" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#767b82">compute_host is reniced -5 to +10 within 2 s.</text>
  <text x="664" y="208" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#767b82">dashboard keeps nice -5 and keeps serving.</text>

  <text x="796" y="236" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="0.9" fill="#767b82">ONE CORE (1 vCPU)</text>
  <text x="1044" y="236" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#767b82">time &#8594;</text>
  <rect x="788" y="250" width="264" height="120" rx="6" fill="none" stroke="#767b82" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="6 5"/>

  <rect x="796" y="264" width="248" height="34" fill="#3b7dd8" fill-opacity="0.22" stroke="#3b7dd8" stroke-width="1.5"/>
  <text x="664" y="287" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#5f646b">dashboard</text>
  <text x="1064" y="287" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#767b82">nice -5</text>

  <rect x="836" y="320" width="144" height="34" fill="#cf7a1f" fill-opacity="0.10" stroke="#cf7a1f" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="664" y="343" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#5f646b">compute_host</text>
  <text x="1064" y="343" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#cf7a1f">nice +10</text>
  <text x="998" y="343" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#767b82">yields</text>

  <text x="664" y="424" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#5f646b">The connection wins the core when both want it.</text>

  <line x1="48" y1="500" x2="1152" y2="500" stroke="#767b82" stroke-opacity="0.45" stroke-width="1"/>
  <text x="48" y="520" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.2" fill="#767b82">MEASURED ON THE 1 vCPU HOST</text>
  <rect x="48" y="541" width="7" height="7" fill="#cf7a1f" fill-opacity="0.55" stroke="#cf7a1f" stroke-width="1"/>
  <text x="68" y="548" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#767b82">worst /api/health 414 ms with four compute loops at nice 0</text>
  <rect x="48" y="565" width="7" height="7" fill="#cf7a1f" fill-opacity="0.55" stroke="#cf7a1f" stroke-width="1"/>
  <text x="68" y="572" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#767b82">the Desktop abandons a dial with no gateway.ready in 15 s</text>
</svg>
