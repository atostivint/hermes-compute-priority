name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux lanes stay psutil-free on purpose: that is the "no new dependency" promise of the
        # port. The Windows lane without psutil proves the fail-open path on a real non-Linux
        # runner; the lanes with psutil actually exercise the enumeration and priority-class code
        # (`tests/test_platform_backend.py` drives a fake psutil, so these lanes are what proves
        # the fake still matches the real API).
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            psutil: "0"
          - os: ubuntu-latest
            python-version: "3.12"
            psutil: "0"
          - os: ubuntu-latest
            python-version: "3.13"
            psutil: "0"
          - os: windows-latest
            python-version: "3.12"
            psutil: "0"
          - os: windows-latest
            python-version: "3.13"
            psutil: "1"
          - os: macos-latest
            python-version: "3.13"
            psutil: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest
        run: python -m pip install --upgrade pytest fastapi
      - name: Install psutil (macOS and Windows lanes only)
        if: matrix.psutil == '1'
        run: python -m pip install psutil
      - name: Run the tests
        run: python -m pytest -q
